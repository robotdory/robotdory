# Authors: robotdory(Taehyeon Kim)
name: Night Delivery
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate today's missions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate.py --user "$PROFILE_USER" \
            --output site/night-delivery.svg --preview site/inline/night-delivery.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
